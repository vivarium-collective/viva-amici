[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-amici"
version = "0.1.0"
description = "Process-bigraph wrapper for AMICI (Advanced Multilanguage Interface to CVODES and IDAS)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "viva-amici authors", email = "noreply@example.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "amici>=1.0",
    "antimony>=2.13",
    "numpy",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
    # ninja is the build backend AMICI invokes to compile each model's C++
    # extension at runtime. Without it AMICI cannot compile ANY model, so it is
    # a hard runtime requirement, not a dev convenience (amici pulls
    # cmake-build-extension but not ninja itself). The ninja wheel drops a
    # ``ninja`` binary into the venv's bin/ — ensure that dir is on PATH when
    # running, since AMICI locates it via shutil.which("ninja").
    "ninja",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "plotly", "bigraph-viz"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-amici"
Upstream = "https://github.com/AMICI-dev/AMICI"
Issues = "https://github.com/vivarium-collective/viva-amici/issues"

[tool.hatch.build.targets.wheel]
packages = ["viva_amici"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# AMICI dumps a compiled package per model under amici_models/; pytest
# must not try to collect those as test files.
norecursedirs = ["amici_models", ".pbg", "investigations", "demo"]

# The Build-and-Push workflow builds a multi-arch image (linux/amd64 AND
# linux/arm64). Declare BOTH as required environments so `uv lock` resolves a
# version of every dependency that is actually installable on each arch. This
# matters for `antimony`: its latest releases (3.x) ship a linux x86_64 wheel
# but NO linux aarch64 wheel and no sdist, so a resolution that ignores arm64
# pins 3.x and then the arm64 image build fails at install time with
# "Distribution `antimony==3.x` can't be installed ... only has wheels for
# manylinux_2_28_x86_64, macosx, win_amd64". With arm64 required, uv forks
# antimony to 2.14.0 (the one release with a manylinux_2_28_aarch64 wheel) for
# linux/arm64 while keeping 3.x everywhere else.
[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# vivarium-workbench isn't on PyPI; pin it to its public git repo so this
# source is portable across CI, Docker, and collaborators' machines. For local
# dev against a sibling checkout, override with an editable install into your
# venv (no committed local path required):
#     uv pip install -e ../vivarium-workbench
[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
